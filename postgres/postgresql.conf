# PostgreSQL 18 for Synapse. docker-compose.yml mounts this as the whole
# config, so anything not set here is the Postgres default.
# SIZING values are for tier 1 (2 vCPU / 4 GB, shared with Synapse); README.md
# lists them per tier. Apply changes with `docker compose restart postgres`.

# Reachable only on the compose backend network.
listen_addresses = '*'
# Synapse opens at most (processes x cp_max from homeserver.yaml).
max_connections = 100

timezone = 'UTC'
log_timezone = 'UTC'

# ------------------------------------------------------------------------------
# SIZING
# ------------------------------------------------------------------------------
shared_buffers = 1GB                    # ~25% of host RAM
effective_cache_size = 2GB              # RAM left for the OS page cache once
                                        # Synapse has its share
work_mem = 8MB                          # per sort/hash node, per connection
maintenance_work_mem = 256MB
autovacuum_work_mem = 128MB             # per autovacuum worker
autovacuum_max_workers = 3
max_wal_size = 2GB
min_wal_size = 256MB

# ------------------------------------------------------------------------------
# WAL and checkpoints. synchronous_commit stays on (the default): Synapse
# leaves it on too, so an acknowledged message survives a crash.
# ------------------------------------------------------------------------------
checkpoint_timeout = 15min
wal_compression = zstd

# ------------------------------------------------------------------------------
# I/O and planner
# ------------------------------------------------------------------------------
# io_uring is blocked by Docker's default seccomp profile and Postgres
# refuses to start with it; worker is the default, pinned here on purpose.
io_method = worker
random_page_cost = 1.1                  # SSD
# Synapse runs many short queries; JIT compile time costs more than it saves.
jit = off

# ------------------------------------------------------------------------------
# Autovacuum. events, event_json, state_groups_state and device_inbox churn
# constantly; the default 20% threshold lets big tables bloat for months.
# ------------------------------------------------------------------------------
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ------------------------------------------------------------------------------
# Observability. Query stats: CREATE EXTENSION pg_stat_statements; once.
# ------------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
log_min_duration_statement = 500ms
log_autovacuum_min_duration = 1s
log_lock_waits = on
log_temp_files = 10MB                   # a query spilling this much wants more work_mem
