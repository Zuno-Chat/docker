# Synapse shared config. The main process loads only this file; each worker
# loads it first, then its own workers/<name>.yaml.
# Lines marked SIZING change with the host: README.md has the value per tier.

# The domain in user IDs. Cannot change once the database exists.
server_name: "zuno.chat"
public_baseurl: "https://api.zuno.chat/"

# Usage totals (users, active users, rooms, messages): enable_metrics below
# gives Prometheus operational numbers only, so these are pushed to
# synapse-usage-exporter on this host (docker-compose.yml), by the background
# worker, 5 minutes after it starts and then every 3 hours.
# Keep the two lines together. report_stats alone falls back to Synapse's
# default endpoint and sends the totals to matrix.org, which the privacy policy
# rules out. The exporter runs only with the monitoring profile: without it the
# push fails with a logged warning and nothing is sent anywhere, and if
# monitoring stays off, set report_stats back to false.
report_stats: true
report_stats_endpoint: http://synapse-usage-exporter:5000/report-usage-stats/push

default_room_version: '12'

# ------------------------------------------------------------------------------
# Listeners. Nothing here is published: nginx is the only public edge.
# ------------------------------------------------------------------------------
listeners:
  # Client API, including media and /_synapse/admin. x_forwarded: nginx sets
  # X-Forwarded-For to the client's address, so per-IP rate limits and "last
  # seen" use the real client instead of nginx.
  - port: 8008
    type: http
    x_forwarded: true
    bind_addresses: ['0.0.0.0']
    resources:
      - names: [client]
  # Worker replication, authenticated by worker_replication_secret.
  - port: 9093
    type: http
    bind_addresses: ['0.0.0.0']
    resources:
      - names: [replication]
  - port: 9000
    type: metrics
    bind_addresses: ['0.0.0.0']

enable_metrics: true

# ------------------------------------------------------------------------------
# Database, Redis, files
# ------------------------------------------------------------------------------
database:
  name: psycopg2
  args:
    user: synapse
    dbname: synapse
    host: postgres
    port: 5432
    # No password: libpq reads PGPASSWORD from the container environment.
    cp_min: 2
    # SIZING: connections per process. Keep (processes x cp_max) well under
    # max_connections in postgresql.conf.
    cp_max: 10

# Replication bus between Synapse processes. Postgres holds all data.
redis:
  enabled: true
  host: redis
  port: 6379

media_store_path: /data/media
log_config: /config/log.yaml
signing_key_path: /data/signing.key

# Generated by bootstrap.sh into the synapse-data volume; never committed.
macaroon_secret_key_path: /data/secrets/macaroon_secret_key
form_secret_path: /data/secrets/form_secret
registration_shared_secret_path: /data/secrets/registration_shared_secret
worker_replication_secret_path: /data/secrets/worker_replication_secret

# ------------------------------------------------------------------------------
# Workers. nginx routes /sync, /events and /initialSync to sync_worker;
# everything else reaches main. Single-instance duties move off main here and
# must never be assigned to two processes.
# ------------------------------------------------------------------------------
instance_map:
  main:
    host: synapse
    port: 9093
  # Scaling step 2 (README.md): uncomment with stream_writers below.
  # event_persister:
  #   host: synapse-event-persister
  #   port: 9093

# stream_writers:
#   events: [event_persister]

run_background_tasks_on: background_worker
update_user_directory_from_worker: background_worker
pusher_instances:
  - background_worker

# ------------------------------------------------------------------------------
# SIZING: caches, per process. Autotuning uses jemalloc (loaded by the image)
# to evict back to target once a process's heap reaches max, which makes max
# the real memory ceiling; the factors only let hot caches grow up to it.
# ------------------------------------------------------------------------------
caches:
  global_factor: 1.0
  per_cache_factors:
    get_users_who_share_room_with_user: 5.0
    _get_state_group_for_event: 5.0
  cache_autotuning:
    max_cache_memory_usage: 384M
    target_cache_memory_usage: 256M
    min_cache_ttl: 5m

event_cache_size: 20K

# ------------------------------------------------------------------------------
# Rate limiting. Per-IP limits rely on x_forwarded above and on nginx trusting
# Cloudflare's ranges (nginx/cloudflare.conf); per-user limits do not.
# ------------------------------------------------------------------------------
rc_message:
  per_second: 0.5
  burst_count: 10

rc_registration:
  per_second: 0.05
  burst_count: 3

rc_registration_token_validity:
  per_second: 0.1
  burst_count: 3

rc_login:
  address:
    per_second: 0.05
    burst_count: 5
  account:
    per_second: 0.05
    burst_count: 5
  failed_attempts:
    per_second: 0.01
    burst_count: 3

rc_admin_redaction:
  per_second: 1
  burst_count: 50

rc_joins:
  local:
    per_second: 0.3
    burst_count: 10

rc_joins_per_room:
  per_second: 1
  burst_count: 10

rc_invites:
  per_room:
    per_second: 0.3
    burst_count: 10
  per_user:
    per_second: 0.05
    burst_count: 5
  per_issuer:
    per_second: 0.3
    burst_count: 10

rc_third_party_invite:
  per_second: 0.2
  burst_count: 10

# ------------------------------------------------------------------------------
# Registration: tokens only, from two sources. Invites are rows created through
# the admin API (POST /_synapse/admin/v1/registration_tokens/new with
# uses_allowed and expiry_time in epoch ms; scripts/invite.sh), and
# zuno_register (modules, below) emails a single-use one to whoever asks. There
# is no static token.
# No 3PID is collected, so there is no self-service password reset.
# ------------------------------------------------------------------------------
enable_registration: true
enable_registration_without_verification: false
registration_requires_token: true
disable_msisdn_registration: true
enable_3pid_lookup: false
enable_set_displayname: true
enable_set_avatar_url: true

# Applies to new passwords only (registration and changes). The app must show
# the M_PASSWORD_TOO_SHORT error it returns.
password_config:
  policy:
    enabled: true
    minimum_length: 12

# Sessions never expire on their own; access tokens do. A client with refresh
# tokens renews its access token daily, one write on the main process each.
# Synapse cannot refuse a login without refresh tokens, so such a session gets
# a one-minute token instead: the app must use them (README.md).
session_lifetime: null
refresh_token_lifetime: 365d
refreshable_access_token_lifetime: 24h
#nonrefreshable_access_token_lifetime: 1m

# MSC3882: a signed-in device can mint a short-lived token that signs in
# another device (POST /_matrix/client/v1/login/get_token). The password is
# asked again first (UIA); the token lives 5 minutes and works once.
login_via_existing_session:
  enabled: true
  require_ui_auth: true
  token_timeout: 5m

# A device idle past refresh_token_lifetime can never sign in again. Deleting
# it stops its to-device inbox (E2EE key traffic) growing forever.
delete_stale_devices_after: 365d

# ------------------------------------------------------------------------------
# Privacy
# ------------------------------------------------------------------------------
allow_public_rooms_without_auth: false
require_auth_for_profile_requests: true
limit_profile_requests_to_users_who_share_rooms: true

user_directory:
  enabled: true
  search_all_users: false
  prefer_local_users: true
  show_locked_users: false

# New rooms are end-to-end encrypted by default; creators can still opt out.
encryption_enabled_by_default_for_room_type: all

redaction_retention_period: 7d
# Short on purpose: abuse reports older than this have no IP history.
user_ips_max_age: 5d
forget_rooms_on_leave: true
# A room every local member has left is purged from the database after this.
# Nobody can rejoin it (no federation); the delay leaves time for abuse reports.
forgotten_room_retention_period: 28d

# Presence costs constant fan-out and leaks online status.
presence:
  enabled: false

# Previews would make the server fetch every linked URL in the clear.
url_preview_enabled: false

# Backstop for pushers not registered with format event_id_only (the app's
# are). Their pushes drop the message content but still carry the sender,
# display name and room name.
push:
  include_content: false

# ------------------------------------------------------------------------------
# Media. Matches nginx's client_max_body_size and Cloudflare's 100 MB request
# body limit (Free/Pro plans).
# ------------------------------------------------------------------------------
max_upload_size: 100M

# Per-user totals on top of max_upload_size, so no one account fills the disk.
media_upload_limits:
  - time_period: 1d
    max_size: 2G
  - time_period: 7d
    max_size: 5G
max_avatar_size: 2M
allowed_avatar_mimetypes: [image/png, image/jpeg, image/webp, image/gif]

# ------------------------------------------------------------------------------
# Federation: off. nginx already rejects federation paths; the empty
# whitelist also stops outbound federation, and no key server is ever asked.
# ------------------------------------------------------------------------------
federation_domain_whitelist: []
trusted_key_servers: []
allow_public_rooms_over_federation: false
allow_profile_lookup_over_federation: false

# ------------------------------------------------------------------------------
# Retention. Both purges run on main, not background_worker: Synapse schedules
# message purges only there, and media purges wherever the media repo loads
# (main alone, since workers/sync.yaml turns it off).
# ------------------------------------------------------------------------------
retention:
  enabled: true
  default_policy:
    min_lifetime: 1d
    max_lifetime: 365d
  allowed_lifetime_min: 1d
  allowed_lifetime_max: 365d
  # Each job walks every room in its range. Rooms on the default one-year
  # policy need a daily pass, not an hourly one.
  purge_jobs:
    - longest_max_lifetime: 3d
      interval: 1h
    - shortest_max_lifetime: 3d
      interval: 1d

# Deletes local media nobody has opened in 90 days. The clock is last access,
# not upload, so anything still being viewed survives: the app's disk cache
# holds attachments for only 1 day, so a scroll-back past that refetches and
# resets the timer. Profile avatars are kept regardless. SIZING: media is the
# resource most likely to exhaust a small host's disk, and scripts/backup.sh
# archives all of it every night.
media_retention:
  local_media_lifetime: 90d

# ------------------------------------------------------------------------------
# Server notices: messages to users from @notices:zuno.chat, sent through the
# admin API (POST /_synapse/admin/v1/send_server_notice). Notice rooms are
# exempt from default encryption. auto_join puts users straight into the room
# instead of inviting them; an invite cannot be rejected, but a joined user can
# leave, and the next notice then opens a new room.
# Changes to the name, topic or avatars reach each existing room with the next
# notice sent to its user, not at restart.
# ------------------------------------------------------------------------------
server_notices:
  system_mxid_localpart: notices
  system_mxid_display_name: Zuno
  # The logo: scripts/notice-avatar.sh uploads it, protects it from media
  # retention above and prints the URI for both avatar lines.
  system_mxid_avatar_url: mxc://zuno.chat/SiqUxQslgYOkLXLLaBLJUgpE
  room_name: Zuno
  room_avatar_url: mxc://zuno.chat/SiqUxQslgYOkLXLLaBLJUgpE
  room_topic: Room used by your server admin to notice you of important information
  auto_join: true

# ------------------------------------------------------------------------------
# Modules. Only the zuno-synapse image (synapse/Dockerfile) can import them; the
# official image crash-loops on this block. Every worker loads them too, but
# nginx routes /_synapse/client/ to main alone. Their secrets are files
# bootstrap.sh writes from .env on every start.
# ------------------------------------------------------------------------------
modules:
  # Calls (docs/design.md in the zuno_calls repo): proxies Cloudflare Calls
  # signaling and mints TURN credentials under
  # /_synapse/client/zuno/calls/cloudflare/, behind Synapse's own token check.
  # app_id and turn_key_id are identifiers, not secrets. Empty values fail
  # config parsing, so Synapse refuses to start until both are set.
  - module: zuno_calls.ZunoCalls
    config:
      cloudflare:
        app_id: "d58eb20e93987d6ed60c97b464afc920"
        app_secret_path: /data/secrets/cf_calls_app_secret
        turn_key_id: "2dbf23ed38919bdd2e2724ed8e54022f"
        turn_api_token_path: /data/secrets/cf_turn_api_token
        turn_credential_ttl: 2h
        timeout: 10s
        turn_timeout: 5s
      # Per (user, device), per Synapse process.
      rate_limit:
        per_second: 5
        burst: 10

  # Signup by emailed code (docs/design.md in the zuno_register repo):
  # POST /_synapse/client/zuno/register/token mints a single-use registration
  # token and emails it through Brevo. Without the brevo section the module
  # registers nothing (the route answers 404); an empty BREVO_API_KEY stops
  # synapse-init, so Synapse does not start.
  - module: zuno_register.ZunoRegister
    config:
      brevo:
        api_key_path: /data/secrets/brevo_api_key
        # Must be an address Brevo has verified for zuno.chat.
        sender_email: noreply@zuno.chat
      # token_ttl stays at its default, 24h: the app tells users the code
      # "expires in 24 hours".
      # Mails per UTC day across every caller. The control that protects the
      # Brevo bill and the sender's reputation: someone varying the address and
      # the IP gets past every other limit. Raise it deliberately for a launch.
      daily_cap: 100
      # Per IP. A day of it, burst included, must stay under daily_cap or
      # Synapse refuses to start, so it sits below the module's default (one
      # per 10 min): one per ~17 min, 89 a day. Carrier NAT puts many real
      # users behind one address, so keep it no tighter than the cap forces.
      rate_limit:
        per_second: 0.001
        burst: 3
