# Redis for Synapse: the pub/sub bus between its processes, plus a few
# expiring cache keys. Losing it only makes workers reconnect and catch up;
# Postgres holds all data.
# Redis rejects comments on the same line as a directive: keep them above.

# Reachable only on the compose backend network, which has no route to the
# internet and excludes the gateway and Sygnal.
bind * -::*
protected-mode no
port 6379

# No persistence: nothing here needs to survive a restart.
save ""
appendonly no

# Every key Synapse writes carries a TTL, and eviction never drops pub/sub
# messages, so evicting keys beats refusing writes.
maxmemory 256mb
maxmemory-policy allkeys-lru

tcp-keepalive 60
timeout 0
