# Zuno server: Cloudflare -> nginx (TLS, public edge) -> Synapse main (with
# the zuno_calls and zuno_push modules) + sync worker + background worker,
# over Postgres and Redis; MAS for accounts and sign-in; Sygnal for push.
# Per-host values and secrets: .env (from .env.example). Sizing and scaling
# steps: README.md.
#
# Networks: `edge` has internet egress and holds everything that talks to
# nginx or the outside; `backend` is internal-only and holds the data
# stores, so neither nginx nor Sygnal can reach Postgres or Redis.
# `monitoring` (internal) carries scrapes and Synapse's usage report to
# synapse-usage-exporter; only Grafana reaches out, through `monitoring-egress`.
# postgres-exporter alone sits on both `backend` and `monitoring`.
#
# Compose checks ${VAR:?} even in services whose profile is off, so the
# monitoring profile's secrets use ${VAR:-} and are checked at container start.

# Project name: containers are zuno_<service>, volumes zuno_<volume>.
name: zuno

x-logging: &logging
  # Rotated and compressed. The default json-file driver never rotates and
  # fills the disk under real traffic.
  driver: local
  options:
    max-size: 20m
    max-file: "5"

# Every config bind uses this long form. With the short `./x:/y:ro` syntax a
# missing source is created as a root-owned *directory*, compose reports no
# error, and the service then fails on a config file that is secretly a
# directory. create_host_path: false makes Docker refuse to start instead, and
# it creates nothing. Named volumes stay short: Docker is meant to create those.
x-bind: &bind
  type: bind
  read_only: true
  bind:
    create_host_path: false

x-mas: &mas
  image: ghcr.io/zuno-chat/zuno-mas:latest
  logging: *logging
  volumes:
    - <<: *bind
      source: ./mas
      target: /config
    - mas-data:/data

x-mas-env: &mas-env
  SYNAPSE_SHARED_SECRET: "${MAS_SHARED_SECRET:?set in .env}"
  DB_PASSWORD: "${MAS_POSTGRES_PASSWORD:?set in .env}"
  SMTP_USERNAME: "${BREVO_SMTP_LOGIN:?set in .env}"
  SMTP_PASSWORD: "${BREVO_SMTP_KEY:?set in .env}"
  TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:?set in .env}"
  TURNSTILE_SECRET: "${TURNSTILE_SECRET_KEY:?set in .env}"

x-synapse: &synapse
  # The zuno-synapse build (.github/workflows/synapse-image.yml):
  # homeserver.yaml loads zuno_calls and zuno_push, which the official image
  # cannot import. latest is the newest master build; to hold or roll
  # back, pin one of its sha-<commit> tags instead.
  image: ghcr.io/zuno-chat/zuno-synapse:latest
  restart: unless-stopped
  logging: *logging
  stop_grace_period: 30s
  environment:
    # homeserver.yaml has no database password; libpq reads this instead.
    PGPASSWORD: "${POSTGRES_PASSWORD:?set in .env}"
    # bootstrap.sh writes these to /data/secrets for zuno_calls and for
    # Synapse's side of MAS. On every Synapse service so a change in .env
    # recreates them all.
    CF_CALLS_APP_SECRET: "${CF_CALLS_APP_SECRET:-}"
    CF_TURN_API_TOKEN: "${CF_TURN_API_TOKEN:-}"
    MAS_SHARED_SECRET: "${MAS_SHARED_SECRET:-}"
  volumes:
    - <<: *bind
      source: ./synapse
      target: /config
    - synapse-data:/data
  networks: [edge, backend, monitoring]

# Workers listen on 8083 (synapse/workers/*.yaml).
x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "curl -fSs http://localhost:8083/health || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 4
  start_period: 30s

# Under memory pressure the kernel kills monitoring before Synapse (0) or
# Postgres (-500).
x-monitoring: &monitoring
  profiles: ["monitoring"]
  restart: unless-stopped
  logging: *logging
  oom_score_adj: 800
  networks: [monitoring]

services:
  nginx:
    container_name: zuno_nginx
    # The stock image: nginx/nginx.conf is the whole edge (README.md).
    image: nginx:stable-alpine
    restart: unless-stopped
    logging: *logging
    # Lets in-flight /sync long-polls (30s) finish on redeploy: nginx stops on
    # SIGQUIT and drains for worker_shutdown_timeout (35s, nginx.conf).
    stop_grace_period: 40s
    command: ["nginx", "-c", "/etc/nginx/zuno/nginx.conf", "-g", "daemon off;"]
    ports:
      - "443:443"
    # Room for worker_connections (nginx.conf) above Docker's default of 1024:
    # each proxied connection is two open files.
    ulimits:
      nofile: 65536
    # Backs listen backlog=8192 (nginx.conf): the kernel silently caps a
    # listen backlog at somaxconn. Both are per network namespace, so set
    # here, not on the host.
    sysctls:
      net.core.somaxconn: 8192
      net.ipv4.tcp_max_syn_backlog: 8192
    environment:
      # maptiler-key.sh hands it to the tile routes.
      MAPTILER_API_KEY: "${MAPTILER_API_KEY:?set in .env: MapTiler API key}"
    volumes:
      # A directory, not single files: an edit shows up in the container, so
      # a reload picks it up (nginx.conf's header).
      - <<: *bind
        source: ./nginx
        target: /etc/nginx/zuno
      # The image runs every /docker-entrypoint.d/*.sh before nginx starts.
      - <<: *bind
        source: ./nginx/maptiler-key.sh
        target: /docker-entrypoint.d/41-maptiler-key.sh
      # Cloudflare Origin CA cert and key for *.zuno.chat. nginx's master
      # process reads them as root.
      - <<: *bind
        source: ./ssl
        target: /certs
    networks: [edge]
    healthcheck:
      # A loopback-only listener (nginx.conf).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 4
    depends_on:
      synapse:
        condition: service_healthy
      synapse-sync:
        condition: service_healthy
      mas:
        condition: service_healthy

  postgres:
    container_name: zuno_postgres
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    # Parallel queries allocate from /dev/shm; Docker's 64MB default fails them.
    shm_size: 256mb
    # A SIGKILL mid-shutdown forces crash recovery on the next start.
    stop_grace_period: 60s
    # Under memory pressure the kernel kills a Synapse process (restarted in
    # seconds) before Postgres (every connection drops, then crash recovery).
    oom_score_adj: -500
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}"
      POSTGRES_DB: synapse
      # Synapse requires a UTF-8 database with C collation.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      # Postgres 18 moved the data tree: mount /var/lib/postgresql, not .../data.
      - postgres-data:/var/lib/postgresql
      - <<: *bind
        source: ./postgres/postgresql.conf
        target: /etc/postgresql/postgresql.conf
    networks: [backend]
    healthcheck:
      # -h forces TCP so the init-time socket-only server does not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U synapse -d synapse"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    container_name: zuno_redis
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - <<: *bind
        source: ./redis/redis.conf
        target: /usr/local/etc/redis/redis.conf
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mas-db-init:
    container_name: zuno_mas-db-init
    image: postgres:18-alpine
    restart: "no"
    logging: *logging
    entrypoint:
      - /bin/sh
      - -c
      - 'exec psql -h postgres -U synapse -d synapse -q -v ON_ERROR_STOP=1 -f /mas-db.sql'
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?set in .env}"
      PGOPTIONS: -c client_min_messages=warning
      DB_PASSWORD: "${MAS_POSTGRES_PASSWORD:?set in .env}"
    volumes:
      - <<: *bind
        source: ./postgres/mas-db.sql
        target: /mas-db.sql
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  mas-init:
    container_name: zuno_mas-init
    <<: *mas
    restart: "no"
    user: "0"
    entrypoint: ["/busybox/sh", "/config/init.sh", "/data"]
    environment: *mas-env
    network_mode: none

  mas:
    container_name: zuno_mas
    <<: *mas
    restart: unless-stopped
    command: ["server"]
    environment:
      <<: *mas-env
      MAS_CONFIG: /config/config.yaml:/data/keys.yaml:/data/env.yaml
    networks: [edge, backend, monitoring]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    depends_on:
      mas-init:
        condition: service_completed_successfully
      mas-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # One-shot bootstrap (synapse/bootstrap.sh): signing key and secret files
  # on first run, and the module secrets from .env on every run.
  synapse-init:
    container_name: zuno_synapse-init
    <<: *synapse
    restart: "no"
    entrypoint: ["/bin/sh", "/config/bootstrap.sh"]

  synapse:
    container_name: zuno_synapse
    <<: *synapse
    # Loopback only, for an admin client on your own machine over an SSH tunnel:
    # ssh -L 8008:localhost:8008 <server> (README.md, Administration). Nothing
    # outside this host can reach it; the public edge (nginx) still refuses
    # /_synapse/admin.
    ports: ["127.0.0.1:8008:8008"]
    command: run -m synapse.app.homeserver --config-path=/config/homeserver.yaml
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      # First start runs the full schema migration on Postgres.
      start_period: 120s
    depends_on:
      synapse-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mas:
        condition: service_healthy

  synapse-sync:
    container_name: zuno_synapse-sync
    <<: *synapse
    command: run -m synapse.app.generic_worker --config-path=/config/homeserver.yaml --config-path=/config/workers/sync.yaml
    healthcheck: *worker-healthcheck
    depends_on:
      synapse:
        condition: service_healthy

  synapse-background:
    container_name: zuno_synapse-background
    <<: *synapse
    command: run -m synapse.app.generic_worker --config-path=/config/homeserver.yaml --config-path=/config/workers/background.yaml
    healthcheck: *worker-healthcheck
    depends_on:
      synapse:
        condition: service_healthy

  # Scaling step 2 (README.md). Idle until homeserver.yaml names it in
  # instance_map and stream_writers; enable with COMPOSE_PROFILES=push,events.
  synapse-event-persister:
    container_name: zuno_synapse-event-persister
    <<: *synapse
    profiles: ["events"]
    command: run -m synapse.app.generic_worker --config-path=/config/homeserver.yaml --config-path=/config/workers/event_persister.yaml
    healthcheck: *worker-healthcheck
    depends_on:
      synapse:
        condition: service_healthy

  sygnal:
    container_name: zuno_sygnal
    # Built and published by element-hq/sygnal; the Docker Hub name is the
    # only one it publishes to (there is no ghcr.io/element-hq/sygnal).
    image: matrixdotorg/sygnal:v0.17.0
    # Sygnal refuses to start without its FCM and APNs credentials, so it
    # runs only with COMPOSE_PROFILES=push (README.md).
    profiles: ["push"]
    restart: unless-stopped
    logging: *logging
    environment:
      SYGNAL_CONF: /sygnal/sygnal.yaml
    volumes:
      - <<: *bind
        source: ./sygnal
        target: /sygnal
    networks: [edge, monitoring]
    healthcheck:
      # The image's own check calls curl, which its runtime layer lacks.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 25s

  # --- Monitoring: COMPOSE_PROFILES=push,monitoring (README.md, Monitoring) ---

  prometheus:
    container_name: zuno_prometheus
    <<: *monitoring
    image: prom/prometheus:v3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
      - --log.level=warn
    volumes:
      - <<: *bind
        source: ./monitoring/prometheus
        target: /etc/prometheus
      - prometheus-data:/prometheus
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 4

  # Usage totals: users, active users, rooms, messages. Synapse exports none of
  # them as Prometheus metrics; it only PUTs them to report_stats_endpoint
  # (homeserver.yaml), 5 minutes after synapse-background starts and then every
  # 3 hours. This holds the latest report for Prometheus to scrape. It has no
  # published port and sits on the internal monitoring network alone, so the
  # totals stay on this host.
  synapse-usage-exporter:
    container_name: zuno_synapse-usage-exporter
    <<: *monitoring
    # One maintainer's Docker Hub image, amd64 only, last built 2023-12: the
    # digest keeps the tag from changing underneath us.
    image: loelkes/synapse-usage-exporter:0.1.0@sha256:1a6699e8b05249665e4dfc2a252dadaba068ed418a84eb230c8f42854ca8c5fc
    # The image runs as root and writes nowhere but the directory below.
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # The app refuses to start without it.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    tmpfs:
      - /tmp/prometheus
    mem_limit: 96m
    healthcheck:
      # Python is the one HTTP client the image is sure to have.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Host metrics: disk, memory, swap, OOM kills, temperature, and the last
  # successful scripts/backup.sh run (textfile collector). It reads the host
  # through a read-only bind of /, and pid: host so the mount table it reads is
  # the host's. It stays on the internal monitoring network, so the network
  # collectors would see only its own interface: they are off.
  node-exporter:
    container_name: zuno_node-exporter
    <<: *monitoring
    image: prom/node-exporter:v1
    command:
      - --path.rootfs=/host
      - --path.udev.data=/host/run/udev/data
      # backup.sh's METRICS_DIR default, through the bind below. If cron sets
      # another METRICS_DIR, change this too.
      - --collector.textfile.directory=/host/var/lib/zuno/metrics
      - --no-collector.arp
      - --no-collector.netclass
      - --no-collector.netdev
      - --no-collector.netstat
      - --no-collector.sockstat
      - --log.level=warn
    pid: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # One-shot, on every `up`: creates the zuno_monitor role postgres-exporter
  # logs in as, or resets its password to POSTGRES_MONITOR_PASSWORD, and the
  # count-only functions behind the account and report notifications
  # (monitoring/postgres/monitor-role.sql).
  postgres-monitor-init:
    container_name: zuno_postgres-monitor-init
    <<: *monitoring
    image: postgres:18-alpine
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$MONITOR_PASSWORD" ] || { echo "Set POSTGRES_MONITOR_PASSWORD in .env" >&2; exit 1; }; exec psql -h postgres -U synapse -d synapse -q -v ON_ERROR_STOP=1 -v pw="$$MONITOR_PASSWORD" -f /monitor-role.sql'
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?set in .env}"
      PGOPTIONS: -c client_min_messages=warning
      MONITOR_PASSWORD: "${POSTGRES_MONITOR_PASSWORD:-}"
    volumes:
      - <<: *bind
        source: ./monitoring/postgres/monitor-role.sql
        target: /monitor-role.sql
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  # Postgres statistics, as zuno_monitor: pg_monitor reads statistics and
  # settings, not tables, and the account and report counts come from
  # functions that return nothing else. On backend to reach Postgres and on
  # monitoring to be scraped; neither network has egress.
  postgres-exporter:
    container_name: zuno_postgres-exporter
    <<: *monitoring
    image: prometheuscommunity/postgres-exporter:v0.20.1
    command:
      - --log.level=warn
      # Per-table statistics are ~29 series for each of Synapse's ~180
      # tables, about 5,000 in all, which no dashboard or alert reads; with
      # the settings dump they would be most of Prometheus' series.
      - --no-collector.stat_user_tables
      - --no-collector.statio_user_tables
      - --no-collector.settings
      # Marked deprecated upstream, and still the only way to add a query:
      # check it still exists before moving this image's tag.
      - --extend.query-path=/etc/postgres-exporter/queries.yaml
    environment:
      DATA_SOURCE_URI: postgres:5432/synapse?sslmode=disable
      DATA_SOURCE_USER: zuno_monitor
      DATA_SOURCE_PASS: "${POSTGRES_MONITOR_PASSWORD:-}"
    volumes:
      - <<: *bind
        source: ./monitoring/postgres/queries.yaml
        target: /etc/postgres-exporter/queries.yaml
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, monitoring]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost:9187/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres-monitor-init:
        condition: service_completed_successfully

  grafana:
    container_name: zuno_grafana
    <<: *monitoring
    image: grafana/grafana:13.2
    # Without an admin password Grafana falls back to admin/admin, and without
    # NTFY_URL alert provisioning fails: refuse to start instead.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] && [ -n "$$NTFY_URL" ] || { echo "Set GRAFANA_ADMIN_PASSWORD and NTFY_URL in .env" >&2; exit 1; }; exec /run.sh'
    # SSH tunnel only: ssh -L 3000:localhost:3000 <server>
    ports: ["127.0.0.1:3000:3000"]
    environment:
      # Applies when grafana-data is first created; later changes need
      # grafana cli admin reset-admin-password.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"
      # Also the base of the panel links in alert notifications: they open
      # through the SSH tunnel.
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/overview.json
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_LEVEL: warn
      GOMEMLIMIT: 300MiB
      # Read by provisioning/alerting/contact-points.yaml.
      NTFY_URL: "${NTFY_URL:-}"
      NTFY_TOKEN: "${NTFY_TOKEN:-}"
    volumes:
      - <<: *bind
        source: ./monitoring/grafana/provisioning
        target: /etc/grafana/provisioning
      - <<: *bind
        source: ./monitoring/grafana/dashboards
        target: /etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    networks: [monitoring, monitoring-egress]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  edge:
  backend:
    internal: true
  monitoring:
    internal: true
  monitoring-egress:

volumes:
  postgres-data:
  synapse-data:
  mas-data:
  prometheus-data:
  grafana-data:
