# Sygnal: Synapse -> gateway (POST /_matrix/push/v1/notify) -> here -> FCM.
# Credentials sit next to this file, mounted read-only at /sygnal; never
# commit them.

log:
  setup:
    version: 1
    formatters:
      normal:
        format: "%(asctime)s [%(process)d] %(levelname)-5s %(name)s %(message)s"
    handlers:
      stdout:
        class: logging.StreamHandler
        formatter: normal
        stream: ext://sys.stdout
    loggers:
      sygnal.access:
        propagate: false
        handlers: [stdout]
        level: INFO
    root:
      handlers: [stdout]
      level: INFO
    disable_existing_loggers: false
  access:
    # Only the gateway connects, and it sets X-Forwarded-For.
    x_forwarded_for: true

http:
  bind_addresses: ['0.0.0.0']
  port: 5000

metrics:
  prometheus:
    enabled: true
    # Compose network only; never publish.
    address: '0.0.0.0'
    port: 8000
  # dsn null: the Sentry SDK reads SENTRY_DSN (SYGNAL_SENTRY_DSN in .env);
  # empty sends nothing.
  sentry:
    enabled: true
    dsn: null

apps:
  # Must match the app_id the client registers its pusher with.
  im.zuno.chat.android:
    type: gcm
    api_version: v1
    project_id: zuno-3748d
    service_account_file: /sygnal/service_account.json
    # Counts are wrong in encrypted rooms, and every room is encrypted.
    send_badge_counts: false
    # SIZING: concurrent connections to FCM.
    max_connections: 20
