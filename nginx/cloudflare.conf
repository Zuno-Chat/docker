# Cloudflare's edge ranges, used twice below: set_real_ip_from trusts
# CF-Connecting-IP from them (a request from anywhere else keeps its own
# address, so the header cannot be forged from outside Cloudflare), and
# $cf_edge lets nginx.conf drop any connection that comes from neither them
# nor this host's own networks. Keep the two lists in step. Source:
# https://www.cloudflare.com/ips/ (checked 2026-09-17). Refresh when
# Cloudflare changes them, then reload nginx (nginx.conf): a stale list now
# also drops connections from Cloudflare's newest edges, not just mislabels
# client addresses.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# $realip_remote_addr is the socket's peer even after the block above
# rewrote $remote_addr, so a forged CF-Connecting-IP changes nothing here.
# The private ranges keep the docker bridge, loopback and a local rehearsal
# (smoke-test.sh, CURL_EXTRA) working; none of them routes from the internet.
geo $realip_remote_addr $cf_edge {
  default 0;
  127.0.0.0/8 1;
  ::1/128 1;
  10.0.0.0/8 1;
  172.16.0.0/12 1;
  192.168.0.0/16 1;
  fc00::/7 1;
  173.245.48.0/20 1;
  103.21.244.0/22 1;
  103.22.200.0/22 1;
  103.31.4.0/22 1;
  141.101.64.0/18 1;
  108.162.192.0/18 1;
  190.93.240.0/20 1;
  188.114.96.0/20 1;
  197.234.240.0/22 1;
  198.41.128.0/17 1;
  162.158.0.0/15 1;
  104.16.0.0/13 1;
  104.24.0.0/14 1;
  172.64.0.0/13 1;
  131.0.72.0/22 1;
  2400:cb00::/32 1;
  2606:4700::/32 1;
  2803:f800::/32 1;
  2405:b500::/32 1;
  2405:8100::/32 1;
  2a06:98c0::/29 1;
  2c0f:f248::/32 1;
}
