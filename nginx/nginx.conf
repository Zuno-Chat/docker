# The public edge: Cloudflare -> here (TLS, Origin CA cert) -> Synapse main,
# the sync worker or Sygnal. Every other path is refused. The stock image, no
# modules added. After an edit, test and reload in place:
#   docker compose exec nginx nginx -t -c /etc/nginx/zuno/nginx.conf
#   docker compose kill -s HUP nginx

user nginx;
worker_processes auto;
# One worker per core, and pinned there: no worker migrates between cores, so
# its caches stay warm.
worker_cpu_affinity auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
# Each proxied request holds two connections, Cloudflare's and Synapse's, so
# a worker needs two fds per connection. Set as root, so it may exceed the
# soft ulimit; docker-compose.yml raises the container's limit to match.
worker_rlimit_nofile 65536;
# Graceful stop (the image stops on SIGQUIT) waits this long for open
# requests. Keep it under stop_grace_period in docker-compose.yml.
worker_shutdown_timeout 35s;

# Per worker. Held connections, not request rate, are what this must fit: a
# /sync long-poll holds its connection for 30 s, so this is ~16k devices
# waiting per core, at two fds each (worker_rlimit_nofile above).
events {
  worker_connections 16384;
}

http {
  default_type application/octet-stream;
  server_tokens off;

  # $uri, not $request: no query strings, which can carry a registration token
  # (/register/m.login.registration_token/validity?token=).
  log_format edge '$remote_addr [$time_local] "$request_method $uri" $status '
                  '$body_bytes_sent $request_time $upstream_response_time '
                  '$upstream_addr';
  # Buffered: one write per 64k of log or 5 s, not one per request.
  access_log /var/log/nginx/access.log edge buffer=64k flush=5s;
  # /maps/ without the tile: z/x/y is where someone looked at a map.
  log_format maps '$remote_addr [$time_local] "$request_method /maps/" $status '
                  '$body_bytes_sent $request_time $upstream_addr';

  # Real client addresses, for Synapse's per-IP limits and the push fence,
  # and $cf_edge for the Cloudflare-only fence below.
  include /etc/nginx/zuno/cloudflare.conf;

  # Zero-copy and full packets for anything nginx serves from a file, and
  # temp-file I/O (large media responses spool through one) on the thread
  # pool instead of blocking the worker's event loop.
  sendfile on;
  tcp_nopush on;
  aio threads;
  # A client that timed out gets an RST and its memory back immediately,
  # instead of a socket lingering in FIN_WAIT.
  reset_timedout_connection on;

  # Docker's embedded DNS. With `resolve` each upstream follows its
  # container's address across recreates without an nginx restart, and one
  # that is not running (Sygnal without the push profile) does not stop nginx
  # from starting.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # keepalive is the idle pool per worker, not a cap; keepalive_requests is
  # how many requests ride one upstream connection before it is re-opened
  # (the 1000 default reconnects measurably often at high rates).
  upstream synapse {
    zone synapse 64k;
    server synapse:8008 resolve;
    keepalive 32;
    keepalive_requests 10000;
  }

  upstream synapse_sync {
    zone synapse_sync 64k;
    server synapse-sync:8083 resolve;
    keepalive 32;
    keepalive_requests 10000;
  }

  # Only zuno_push's test alert: background_worker is the pusher instance.
  upstream synapse_background {
    zone synapse_background 64k;
    server synapse-background:8083 resolve;
    keepalive 8;
  }

  upstream sygnal {
    zone sygnal 64k;
    server sygnal:5000 resolve;
    keepalive 8;
  }

  # Map tiles (the /maps/ route). Docker's DNS forwards outside names too.
  upstream maptiler {
    zone maptiler 64k;
    server api.maptiler.com:443 resolve;
    keepalive 8;
  }

  # The app's User-Agent, "Zuno/<version> (Android; im.zuno.chat)", carries
  # its package name: the substring MapTiler's key restriction matched while
  # the app fetched tiles itself, so /maps/ asks for the same.
  map $http_user_agent $zuno_app {
    "~im\.zuno\.chat" 1;
    default 0;
  }

  # Slow-client fence. The body timeout is the gap between two reads, not the
  # whole body, so an upload runs as long as it keeps moving.
  client_header_timeout 10s;
  client_body_timeout 60s;
  keepalive_timeout 120s;
  # Cloudflare reuses its connections here hard; re-handshaking TLS every
  # 1000 requests (the default) is real CPU at high rates.
  keepalive_requests 10000;
  # homeserver.yaml's max_upload_size, and Cloudflare's 100 MB request limit.
  client_max_body_size 100m;

  # Every proxied location inherits these: none may set its own
  # proxy_set_header, or it drops all of them. /maps/ does, on purpose.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  # Set, never appended: Synapse and Sygnal read the leftmost address, which
  # would otherwise be whatever the client sent.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  # Upstreams are on this host: a connect that takes seconds means down, not
  # far away.
  proxy_connect_timeout 5s;
  # Cloudflare gives up on a request after 100 s; /sync long-polls for 30.
  proxy_read_timeout 100s;
  proxy_send_timeout 100s;
  # 128k in memory per response in flight; past that a response spools to a
  # temp file, which frees Synapse's one Python thread at upstream speed, but
  # is capped so one response cannot write the default gigabyte to disk.
  proxy_buffers 16 8k;
  proxy_max_temp_file_size 32m;

  limit_req_zone $binary_remote_addr zone=push:1m rate=50r/s;
  # MapTiler bills every tile nginx fetches: a ceiling per client address, and
  # one across all of them ($server_name is the same for every request).
  limit_req_zone $binary_remote_addr zone=maps:10m rate=20r/s;
  limit_req_zone $server_name zone=maps_total:64k rate=50r/s;
  # A runaway or hostile client address, stopped before Synapse spends Python
  # CPU on it. Generous on purpose: an app start is tens of requests, CGNAT
  # puts many users behind one address, and Synapse's own per-endpoint limits
  # are tighter where it matters.
  limit_req_zone $binary_remote_addr zone=api:20m rate=100r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Cloudflare is the only client (the $cf_edge fence below): TLS 1.2 only
  # with the ECDHE+AEAD suites its ClientHello leads with, and TLS 1.3.
  # Cloudflare picks the suite its hardware runs fastest.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_ecdh_curve X25519:prime256v1:secp384r1;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 4h;

  # Any other hostname: no handshake without the right SNI, and 421 for a
  # request that names another Host after one.
  server {
    # reuseport: one listening socket per worker, connections spread by the
    # kernel, no accept contention between workers. The backlog only holds
    # if net.core.somaxconn covers it (docker-compose.yml sets it).
    listen 443 ssl default_server reuseport backlog=8192;
    ssl_reject_handshake on;
    return 421;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name api.zuno.chat;

    # Cloudflare Origin CA cert for *.zuno.chat (README.md, First deploy).
    ssl_certificate /certs/cf_origin_cert.pem;
    ssl_certificate_key /certs/cf_origin_key.key;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # Media is user-uploaded: no MIME-sniffing around its Content-Type.
    add_header X-Content-Type-Options nosniff always;

    # Whoever finds the origin IP and sends the right SNI is still not
    # Cloudflare or this host's own networks (cloudflare.conf): close without
    # answering, and every real request keeps Cloudflare's protections in
    # front of Synapse.
    if ($cf_edge = 0) {
      return 444;
    }

    # A "." or ".." segment, literal or percent-encoded. nginx routes on the
    # normalized path but proxies the raw one, so a later hop that normalizes
    # it could land past the refusals below.
    if ($request_uri ~* "^[^?]*(/|%2f)(\.|%2e){1,2}(/|%2f|\?|$)") {
      return 400;
    }

    # Inherited by every location that sets no limits of its own; push and
    # /maps/ set theirs.
    limit_req zone=api burst=200 nodelay;
    limit_conn perip 128;

    # Client API: main, except the sync family.
    location /_matrix/ {
      proxy_pass http://synapse;
    }

    # /sync, /events and /initialSync (also a room's): the sync worker.
    location ~ ^/_matrix/client/(.*/)?(sync|events|initialSync)$ {
      proxy_pass http://synapse_sync;
    }

    # Federation is off (homeserver.yaml).
    location ^~ /_matrix/federation/ {
      return 403;
    }
    location ^~ /_matrix/key/ {
      return 403;
    }

    # Push: Synapse -> Cloudflare -> here -> Sygnal. Synapse posts to the
    # public URL, so the route is public by nature: only the server's own
    # addresses may use it (push-allow.sh writes the list from
    # PUSHER_ALLOWED_CIDRS), each at 50/s, burst 200.
    location = /_matrix/push/v1/notify {
      include /etc/nginx/push-allow.conf;
      limit_req zone=push burst=200 nodelay;
      client_max_body_size 256k;
      proxy_pass http://sygnal;
    }

    # Map tiles: /maps/{z}/{x}/{y} -> MapTiler. nginx adds the key
    # (maptiler-key.sh writes it from MAPTILER_API_KEY), so it ships in neither
    # the app nor the well-known. Only digits reach the upstream URL: the key
    # buys these tiles and nothing else of MapTiler's API. The style and size
    # are the app's contract: 256 px tiles, drawn at 2x. No shared cache here:
    # MapTiler's terms allow only per-user caches without written approval.
    location ~ "^/maps/(?<tile_z>\d{1,2})/(?<tile_x>\d{1,7})/(?<tile_y>\d{1,7})$" {
      if ($zuno_app = 0) {
        return 403;
      }
      # A map view asks for 15-30 tiles at once.
      limit_req zone=maps burst=120 nodelay;
      limit_req zone=maps_total burst=500 nodelay;
      access_log /var/log/nginx/access.log maps buffer=64k flush=5s;
      include /etc/nginx/maptiler-key.conf;

      proxy_pass https://maptiler/maps/streets-v4/256/$tile_z/$tile_x/$tile_y@2x.png?key=$maptiler_key;
      # Only the headers below: no client address, token or cookie reaches
      # MapTiler.
      proxy_pass_request_headers off;
      proxy_set_header Host api.maptiler.com;
      proxy_set_header User-Agent im.zuno.chat;
      proxy_set_header Connection "";
      proxy_hide_header Set-Cookie;
      # nginx sends no SNI and checks no upstream certificate by default.
      proxy_ssl_server_name on;
      proxy_ssl_name api.maptiler.com;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
    }

    # Module endpoints on main: zuno_calls (/_synapse/client/zuno/calls/),
    # zuno_register (/_synapse/client/zuno/register/token) and zuno_push
    # (/_synapse/client/zuno/push/v1/).
    location /_synapse/client/ {
      proxy_pass http://synapse;
    }
    # zuno_push's test alert goes through Synapse's own pusher, so only the
    # pusher instance can send it (pusher_instances in homeserver.yaml).
    # Synapse serves module routes on every listener, so background_worker's
    # health listener answers it.
    location = /_synapse/client/zuno/push/v1/test {
      proxy_pass http://synapse_background;
    }
    # Without it nginx redirects the slash-less path into the block above.
    location = /_synapse/client {
      return 403;
    }

    # The admin API and the rest of /_synapse/. Admin goes over the SSH tunnel
    # to 127.0.0.1:8008 (README.md, Administration).
    location /_synapse/ {
      return 403;
    }

    location / {
      return 404;
    }
  }

  # Docker's healthcheck, from inside the container only.
  server {
    listen 127.0.0.1:8080;
    access_log off;

    location = /health {
      return 200;
    }

    location / {
      return 404;
    }
  }
}
