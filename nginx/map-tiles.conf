# Map tiles: {z}/{x}/{y} -> MapTiler, included by each tile route in
# nginx.conf, which captures $tile_z, $tile_x and $tile_y. nginx adds the key
# (maptiler-key.sh writes it from MAPTILER_API_KEY), so it ships in neither
# the app nor the well-known. Only digits reach the upstream URL: the key
# buys these tiles and nothing else of MapTiler's API. The style and size
# are the app's contract: 256 px tiles, drawn at 2x. No shared cache here:
# MapTiler's terms allow only per-user caches without written approval.
if ($zuno_app = 0) {
  return 403;
}
# A map view asks for 15-30 tiles at once.
limit_req zone=maps burst=120 nodelay;
limit_req zone=maps_global burst=500 nodelay;
access_log /var/log/nginx/access.log maps buffer=64k flush=5s;
include /etc/nginx/maptiler-key.conf;

proxy_pass https://maptiler/maps/streets-v4/256/$tile_z/$tile_x/$tile_y@2x.webp?key=$maptiler_key;
# Only the headers below: no client address, token or cookie reaches
# MapTiler.
proxy_pass_request_headers off;
proxy_set_header Host api.maptiler.com;
proxy_set_header User-Agent im.zuno.chat;
proxy_set_header Connection "";
proxy_hide_header Set-Cookie;
proxy_hide_header Cache-Control;
add_header Cache-Control "private, max-age=28800" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
# nginx sends no SNI and checks no upstream certificate by default.
proxy_ssl_server_name on;
proxy_ssl_name api.maptiler.com;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_connect_timeout 5s;
proxy_read_timeout 15s;
