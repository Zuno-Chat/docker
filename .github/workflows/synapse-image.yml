# Builds ghcr.io/zuno-chat/zuno-synapse from synapse/Dockerfile and pushes it
# tagged sha-<commit> and, on master, latest, which docker-compose.yml runs.
# Bump a module's wheel tag in the Dockerfile and push; the server picks the
# build up on its next docker compose pull. GITHUB_TOKEN pulls the private
# wheel images: each one's package settings grant this repo read access under
# Manage Actions access. Actions are pinned to commit SHAs; the comment is the
# tag that SHA was.
name: synapse-image

on:
  push:
    branches: [master]
    paths:
      - synapse/Dockerfile
      - synapse/.dockerignore
      - .github/workflows/synapse-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/zuno-synapse
          # A workflow_dispatch from another branch gets only its sha tag.
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: synapse
          # The server is amd64; the base image is multi-arch but a pip build per
          # platform doubles the run for nothing.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
