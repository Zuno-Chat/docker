# Builds zuno-synapse through image.yml. Bump a module's wheel tag in the
# Dockerfile and push; the server picks the build up on its next docker
# compose pull. GITHUB_TOKEN pulls the private wheel images: each one's package
# settings grant this repo read access under Manage Actions access.
name: synapse-image

on:
  push:
    branches: [master]
    paths:
      - synapse/Dockerfile
      - synapse/.dockerignore
      - .github/workflows/synapse-image.yml
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: ./.github/workflows/image.yml
    with:
      image: zuno-synapse
      context: synapse
