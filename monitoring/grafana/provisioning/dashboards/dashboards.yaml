# Dashboards are files: edits made in the UI are refused, so change the JSON
# in monitoring/grafana/dashboards instead.
apiVersion: 1

providers:
  - name: zuno
    folder: Zuno
    folderUid: zuno
    type: file
    # false, so removing a dashboard's file removes the dashboard; true would
    # keep it in Grafana as an ordinary, unprovisioned dashboard.
    disableDeletion: false
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
